<g transform="translate(112 570)"><rect width="520" height="290" rx="16" class="card"/><text x="32" y="62" class="num">04</text><text x="130" y="55" class="ui title" font-size="26">PU 上下文</text><text x="32" y="112" class="ui label">默认 PU2；切换后保留各自窗口与偏差</text><text x="32" y="165" class="amber label">PU2–PU10 · 可切换</text><text x="32" y="211" class="muted label">PU1 · 暂无锁定标记检测</text><text x="32" y="257" class="muted label">整机页点击色组 → 直接进入对应 PU</text></g>
