<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A131A"/><stop offset="1" stop-color="#071016"/></linearGradient><pattern id="g3" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#27343D" opacity=".55"/></pattern><style>.ui{font-family:Inter,Arial,"PingFang SC",sans-serif;fill:#E8F0F4}.muted{fill:#8FA3AF}.tiny{font-size:14px;letter-spacing:1px}.label{font-size:20px}.title{font-size:34px;font-weight:700}.amber{fill:#FFC857}.green{fill:#40D998}.red{fill:#FF6565}.purple{fill:#B93CCF}.card{fill:#141D24;stroke:#29404B;stroke-width:1}.num{font-size:56px;font-weight:700;fill:#27D4ED}</style></defs><rect width="1920" height="1080" fill="url(#bg3)"/><rect width="1920" height="1080" fill="url(#g3)" opacity=".28"/><text x="112" y="110" class="ui title">INTERACTION &amp; STATE NOTES</text><text x="112" y="148" class="muted label">VISU·19 / INDUSTRIAL CONSOLE v2 · PRODUCT UI / P0–P1 DESIGN BASELINE</text><line x1="112" y1="182" x2="1808" y2="182" stroke="#29404B"/>
