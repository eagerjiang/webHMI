<g transform="translate(700 230)"><rect width="520" height="290" rx="16" class="card"/><text x="32" y="62" class="num">02</text><text x="130" y="55" class="ui title" font-size="26">坐标闭环</text><text x="32" y="112" class="ui label">屏幕坐标 ⇄ Canvas 逻辑坐标 ⇄ 数据坐标</text><rect x="32" y="145" width="456" height="52" rx="8" fill="#172A35"/><text x="54" y="178" class="amber label">xMin / xMax · sample</text><rect x="32" y="213" width="456" height="52" rx="8" fill="#172A35"/><text x="54" y="246" class="green label">yMin / yMax · signal %</text></g>
